<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Blog</title>
  <style>
    .blog {
      display: grid;
      grid-template-columns: 3fr 1fr;
      grid-template-rows: repeat(3, auto);
      gap: 20px;
      padding: 20px;
      box-sizing: border-box;
      place-content: start center;
    }

    .posts {
      display: grid;
      grid-template-rows: repeat(3, auto);
      gap: 15px;
      justify-items: stretch;
      align-items: start;
    }

    .post {
      background-color: #f0f0f0;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
    }

    .post.destacado {
      background-color: lightblue;
      place-self: center;
    }

    .sidebar {
      background-color: lightgray;
      padding: 15px;
      border-radius: 8px;
      justify-self: stretch;
      align-self: start;
    }
  </style>
</head>

<body>

  <section class="blog">
    <main class="posts">
      <article class="post">
        <h2>Artículo 1</h2>
        <p>Contenido del artículo.</p>
      </article>

      <article class="post destacado">
        <h2>Artículo destacado</h2>
        <p>Contenido del artículo.</p>
      </article>

      <article class="post">
        <h2>Artículo 3</h2>
        <p>Contenido del artículo.</p>
      </article>
    </main>

    <aside class="sidebar">
      <h3>Barra lateral</h3>
      <p>Enlaces, publicidad, etc.</p>
    </aside>
  </section>

</body>

</html>
